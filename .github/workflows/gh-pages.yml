name: GitHub Pages

on:
  push:
    branches:
      - master # Branch to deploy
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_CACHEDIR: /tmp/hugo_cache # Fixed cache dir, independent of the Hugo version

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The theme comes from the submodule commit recorded in this repo; Dependabot proposes updates as PRs.
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0 # Full history for .GitInfo and .Lastmod

      # The Hugo version is pinned in one place: .env (also used by docker-compose.yml).
      - name: Read Hugo version from .env
        id: hugo-version
        run: |
          . ./.env
          echo "HUGO_VERSION=${HUGO_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo-version.outputs.HUGO_VERSION }}
          extended: true

      - uses: actions/cache@v6
        with:
          path: |
            ${{ env.HUGO_CACHEDIR }}
            resources/_gen
          key: ${{ runner.os }}-hugo-${{ steps.hugo-version.outputs.HUGO_VERSION }}-${{ hashFiles('content/**/*.png', 'content/**/*.jpg', 'layouts/_markup/**') }}
          restore-keys: |
            ${{ runner.os }}-hugo-${{ steps.hugo-version.outputs.HUGO_VERSION }}-

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
