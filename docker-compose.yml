services:
  hugo:
    container_name: hugo
    # Official Hugo image (extended, with Dart Sass); version pinned in .env
    image: ghcr.io/gohugoio/hugo:v${HUGO_VERSION}
    ports:
      - 1313:1313
    volumes:
      - ${PWD}:/project
    command:
      - server
      - --bind=0.0.0.0
      - --buildDrafts
